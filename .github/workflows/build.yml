name: Build MAUI App

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore MAUI workloads
        run: dotnet workload restore

      - name: Restore dependencies for each target
        run: |
          dotnet restore --runtime android-arm64
          dotnet restore --runtime android-arm
          dotnet restore --runtime android-x64
          dotnet restore --runtime android-x86
          dotnet restore --runtime windows10.0.19041.0

      - name: Build
        run: dotnet build --configuration Release --no-restore
