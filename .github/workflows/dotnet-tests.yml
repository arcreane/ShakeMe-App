name: Run .NET Core Unit Tests

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies for test project
        run: dotnet restore ShakeMe.Tests/ShakeMe.Tests.csproj

      - name: Build test project only
        run: dotnet build ShakeMe.Tests/ShakeMe.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ShakeMe.Tests/ShakeMe.Tests.csproj --no-restore --verbosity normal
      
